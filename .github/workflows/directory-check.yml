name: Verifica directory
on:
  pull_request:
  push:
    branches: ['directory-*', 'site-nuovo-*', 'censimento-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Test di conservazione confrontano il commit storico 6cb31fc.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
